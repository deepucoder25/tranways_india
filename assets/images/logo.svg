<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100">
  <defs>
    <style>
      .green-text { font-family: 'Montserrat', 'Inter', 'Segoe UI', sans-serif; font-weight: 800; font-size: 34px; fill: #114227; letter-spacing: 0.5px; }
      .orange-text { font-family: 'Montserrat', 'Inter', 'Segoe UI', sans-serif; font-weight: 800; font-size: 34px; fill: #f37021; letter-spacing: 0.5px; }
      .sub-text { font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 600; font-size: 15px; fill: #2c3e50; letter-spacing: 5px; }
      .house-stroke { stroke: #114227; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .orange-fill { fill: #f37021; }
      .truck-fill { fill: #114227; }
      .truck-dark { fill: #0b2e1b; }
      .wheel-fill { fill: #2c3e50; }
      .wheel-inner { fill: #ffffff; }
      .box-stroke { stroke: #ffffff; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- ==================== ICON GROUP ==================== -->
  <g transform="translate(5, 5)">
    <!-- House Outline -->
    <!-- Roof -->
    <path d="M 15 50 L 50 15 L 85 50" class="house-stroke" />
    <path d="M 70 33 L 70 20 L 76 20 L 76 39" class="house-stroke" />
    <!-- Pillars / Walls -->
    <path d="M 23 48 L 23 75 L 77 75 L 77 48" class="house-stroke" />
    
    <!-- Orange Box Inside House (moving/packing box) -->
    <rect x="36" y="52" width="28" height="20" rx="2" class="orange-fill" />
    <!-- Tape / Detail on Box -->
    <line x1="36" y1="62" x2="64" y2="62" stroke="#ffffff" stroke-width="2" />
    <line x1="50" y1="52" x2="50" y2="72" stroke="#ffffff" stroke-width="2" />

    <!-- Green Moving Truck -->
    <g transform="translate(15, 0)">
      <!-- Motion lines behind truck -->
      <line x1="15" y1="55" x2="35" y2="55" stroke="#f37021" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <line x1="10" y1="62" x2="30" y2="62" stroke="#114227" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <line x1="18" y1="69" x2="33" y2="69" stroke="#114227" stroke-width="2" stroke-linecap="round" opacity="0.8" />

      <!-- Cargo Body -->
      <rect x="42" y="44" width="46" height="32" rx="3" class="truck-fill" />
      
      <!-- Cargo Boxes visual on truck -->
      <rect x="47" y="49" width="16" height="12" rx="1" class="box-stroke" opacity="0.8" />
      <rect x="65" y="49" width="18" height="22" rx="1" class="box-stroke" opacity="0.8" />
      <!-- Number '1' / Cargo Logo inside cargo container -->
      <text x="74" y="66" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">1</text>

      <!-- Truck Cab -->
      <path d="M 88 52 L 102 52 C 105 52 108 55 108 58 L 108 72 C 108 74 106 76 104 76 L 88 76 Z" class="truck-dark" />
      <!-- Cab Window -->
      <path d="M 90 56 L 98 56 C 100 56 102 58 102 60 L 102 66 L 90 66 Z" fill="#ffffff" opacity="0.9" />
      
      <!-- Bumper / Lights -->
      <rect x="105" y="70" width="5" height="3" rx="1" fill="#f37021" />

      <!-- Wheels -->
      <!-- Back Wheel -->
      <circle cx="54" cy="78" r="8" class="wheel-fill" />
      <circle cx="54" cy="78" r="3.5" class="wheel-inner" />
      <!-- Front Wheel -->
      <circle cx="96" cy="78" r="8" class="wheel-fill" />
      <circle cx="96" cy="78" r="3.5" class="wheel-inner" />
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY GROUP ==================== -->
  <g transform="translate(145, 48)">
    <text x="0" y="0">
      <tspan class="green-text">TRANWAYS </tspan>
      <tspan class="orange-text">INDIA</tspan>
    </text>
    <text x="3" y="26" class="sub-text">PACKERS AND MOVERS</text>
  </g>
</svg>
